name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Verify Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Delete stale pubspec.lock and re-resolve
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run flutter doctor
        run: flutter doctor -v

      - name: Run tests
        run: flutter test --no-pub || true

      - name: Build debug APK (verbose)
        run: flutter build apk --debug --no-pub --verbose 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          retention-days: 7

      - name: Find and upload APK
        if: success()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== Build outputs ==="
          find . -path "*/build/outputs/*" -type f 2>/dev/null
        continue-on-error: true

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "✅ **APK built successfully!** Download from Artifacts tab." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed.** Download build-log.txt from Artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

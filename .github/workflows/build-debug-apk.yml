name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -10

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Show build output
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -150 build-output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build output found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Build failed with exit code ${{ steps.build.outputs.exit_code }}"
          exit 1

      - name: Find APK file
        if: steps.build.outputs.exit_code == '0'
        run: |
          echo "=== Looking for APK ==="
          find android/app/build -name "*.apk" -type f 2>/dev/null || echo "No APK in android/app/build"
          echo "=== Full outputs tree ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "No outputs dir"
          echo "=== Build dir contents ==="
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug apk dir"
          # Also check the flutter output path
          find build -name "*.apk" -type f 2>/dev/null || echo "No APK in build/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          if-no-files-found: warn

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn

name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -10

      - name: Build debug APK
        run: flutter build apk --debug > build-output.txt 2>&1; echo "EXIT_CODE=$?" >> build-output.txt; cat build-output.txt | tail -100

      - name: Debug - list build directory
        if: always()
        run: |
          echo "=== All files ==="
          find build -type f 2>/dev/null | head -50 || echo "No build/"
          find . -name "*.apk" 2>/dev/null || echo "No APK"
          echo "=== Last 200 lines of build output ==="
          tail -200 build-output.txt 2>/dev/null || echo "No output"

      - name: Summary
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "## ✅ APK Built" >> $GITHUB_STEP_SUMMARY
            echo "Path: \`$APK\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 50 lines of build output:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 build-output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

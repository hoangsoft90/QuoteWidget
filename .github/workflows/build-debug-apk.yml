name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -20

      - name: Build debug APK
        run: flutter build apk --debug 2>&1 | tail -20

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
            echo "apk_size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
            echo "✅ APK found: $APK ($(du -h "$APK" | cut -f1))"
          else
            echo "❌ No APK found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK:** Download from **Actions** → this run → **debug-apk** artifact" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** ${{ steps.find-apk.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

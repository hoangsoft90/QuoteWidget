name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Verify Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub || true

      - name: Build debug APK
        run: flutter build apk --debug --verbose 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: List APK files
        if: always()
        run: |
          echo "=== APK search ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "NONE"
          echo "=== build/ tree ==="
          find build -type f 2>/dev/null | head -30 || echo "No build/ dir"
          echo "=== Last 50 lines of build output ==="
          tail -50 build-output.txt 2>/dev/null || echo "No build output"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: "**/*.apk"
          retention-days: 7
          if-no-files-found: warn

      - name: Check build result
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "✅ APK found: $APK ($(du -h "$APK" | cut -f1))"
            exit 0
          else
            echo "❌ No APK found"
            echo ""
            echo "=== Last 100 lines of build output ==="
            tail -100 build-output.txt 2>/dev/null
            exit 1
          fi

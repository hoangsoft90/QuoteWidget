name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -10

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-output.txt
          echo "GRADLE_EXIT=$?" >> ../build-output.txt

      - name: Debug output
        if: always()
        run: |
          echo "=== Last 200 lines ==="
          tail -200 build-output.txt 2>/dev/null || echo "No output"
          echo "=== APK search ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK"
          echo "=== build tree ==="
          find app/build -type f -name "*.apk" 2>/dev/null || echo "No APK in app/build/"
          find build -type f -name "*.apk" 2>/dev/null || echo "No APK in build/"

      - name: Summary
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "## ✅ APK Built" >> $GITHUB_STEP_SUMMARY
            echo "Path: \`$APK\` ($(du -h "$APK" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 build-output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

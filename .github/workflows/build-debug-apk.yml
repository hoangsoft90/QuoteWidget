name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -10

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Debug - list build directory
        if: always()
        run: |
          echo "=== build/ tree ==="
          find build -type f 2>/dev/null | head -50
          echo "=== All .apk files ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== All outputs ==="
          find . -path "*/outputs/*" -type f 2>/dev/null | head -20
          echo "=== flutter build info ==="
          flutter build apk --help 2>&1 | head -5

      - name: Summary
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "✅ APK: $APK ($(du -h "$APK" | cut -f1))" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK found - check Debug step above" >> $GITHUB_STEP_SUMMARY
          fi

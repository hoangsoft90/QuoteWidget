name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      # Device-QA gate (Phase 4): manual dispatch lets QA build the release
      # candidate with PRODUCTION ad units (TEST_ADS=false) for MUST cases
      # C1/H1 — without any local build. Push builds keep defaulting to test
      # ads (expression falls back to 'true' when inputs is empty).
      test_ads:
        description: 'Use Google test ad unit IDs (true) or production units (false)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must be a Flutter whose Gradle plugin defaults compileSdk >= 36
          # (the project pins compileSdk/targetSdk 36 for Google Play's
          # 2026-08-31 API-36 requirement).
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Analyze
        # plan6 C5: fatal warnings — a warning (e.g. `unused_local_variable`
        # silently ignored) must fail CI instead of shipping dead/broken code.
        run: flutter analyze --no-pub --fatal-warnings

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -10

      - name: Decode release keystore from CI secrets
        # Release-engineering Task 4: only runs when the user has configured
        # the RELEASE_* secrets in GitHub repo Settings. Never hardcode secret
        # values here — this just materializes android/key.properties +
        # upload-keystore.jks so gradle picks real signing (Task 1 fallback
        # covers the no-secret case).
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${RELEASE_STORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build debug APK
        id: build
        run: |
          flutter build apk --debug 2>&1 | tee build-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Show build output
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 build-output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "Build failed with exit code ${{ steps.build.outputs.exit_code }}"
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          if-no-files-found: warn

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Build release APK
        id: build-release
        run: |
          flutter build apk --release --no-pub \
            --dart-define=TEST_ADS=${{ inputs.test_ads || 'true' }} 2>&1 | tee build-release-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Show release build output
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 build-release-output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if release build failed
        if: steps.build-release.outputs.exit_code != '0'
        run: |
          echo "Release build failed with exit code ${{ steps.build-release.outputs.exit_code }}"
          exit 1

      - name: Upload release APK artifact
        if: steps.build-release.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn

      - name: Build release AAB
        # Release-engineering Task 2: AAB for Play Console upload. Until the
        # RELEASE_* CI secrets are configured (see checklist.md), there is no
        # android/key.properties on the runner, so this signs with the DEBUG
        # key (gradle fallback) — Play rejects debug-signed bundles; real
        # signing activates automatically once secrets exist.
        id: build-aab
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=TEST_ADS=${{ inputs.test_ads || 'true' }} 2>&1 | tee build-aab-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fail if AAB build failed
        if: steps.build-aab.outputs.exit_code != '0'
        run: |
          echo "AAB build failed with exit code ${{ steps.build-aab.outputs.exit_code }}"
          exit 1

      - name: Upload AAB artifact
        if: steps.build-aab.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

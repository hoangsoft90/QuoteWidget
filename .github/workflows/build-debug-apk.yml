name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Analyze code
        run: flutter analyze --no-pub 2>&1 | tail -30

      - name: Run tests
        run: flutter test --no-pub 2>&1 | tail -20

      - name: Build debug APK
        run: flutter build apk --debug --verbose 2>&1 | tail -100

      - name: Find APK
        run: |
          echo "=== Searching ==="
          find . -name "*.apk" -type f
          echo "=== Build outputs ==="
          find build -type f 2>/dev/null | grep -i apk || echo "No APK in build/"

name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Verify Flutter & Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Run tests
        run: flutter test --no-pub || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: List all build outputs
        if: always()
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Build directory tree ==="
          find build -type f -name "*.apk" 2>/dev/null || echo "No files in build/"
          find app/build -type f -name "*.apk" 2>/dev/null || echo "No files in app/build/"
          echo "=== Full build tree ==="
          find build -type f 2>/dev/null | head -50

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$APK" ]; then
            echo "✅ **APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "Path: \`$APK\`" >> $GITHUB_STEP_SUMMARY
            echo "Size: $(du -h "$APK" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **No APK found.** Check build output above." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

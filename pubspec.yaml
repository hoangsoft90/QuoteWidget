name: quotewidget
description: "Personal content, reminders, notes & quotes on your Home Screen"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  home_widget: ^0.7.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  device_info_plus: ^11.3.0
  workmanager: ^0.5.2
  intl: ^0.19.0
  shared_preferences: ^2.3.4
  in_app_purchase: ^3.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
